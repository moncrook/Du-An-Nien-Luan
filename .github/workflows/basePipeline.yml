name: Base CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/moncrook/du-an-nien-luan

jobs:
  # ============================================================
  # 1. LINT + UNIT TEST
  # ============================================================
  Code-Lint-and-Test:
    name: Code Lint and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cài đặt dependencies
        run: npm ci

      - name: Kiểm tra npm audit
        run: npm audit --audit-level=high

      - name: Kiểm tra cú pháp
        run: npm run lint --if-present

      - name: Chạy Unit Test
        run: npm test

  # ============================================================
  # 2. BUILD, SCAN TRIVY & PUSH TO GHCR (Tối ưu 1 lần Build)
  # ============================================================
  build-scan-and-push:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest
    needs: Code-Lint-and-Test

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Dùng Token mặc định của GitHub

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=v2
            type=raw,value=latest

      # --------------------------------------------------------
      # Step 1: Build Image lưu vào Docker Daemon Local để Scan & Test
      # --------------------------------------------------------
      - name: Build Docker Image Local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true # Tải vào docker daemon local
          tags: todo-nodejs-api:v2
          cache-from: type=gha # Tối ưu tốc độ Build nhờ Cache
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Step 2: Verify & Test Container
      # --------------------------------------------------------
      - name: Verify production dependencies & Node version
        run: |
          docker run --rm todo-nodejs-api:v2 node --version
          docker run --rm todo-nodejs-api:v2 npm --version

      # --------------------------------------------------------
      # Step 3: Trivy Scan (Chặn nếu có lỗi CRITICAL/HIGH)
      # --------------------------------------------------------
      - name: Download Trivy DB & Scan Image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            todo-nodejs-api:v2

      # --------------------------------------------------------
      # Step 4: Push Image lên GHCR (Chỉ chạy khi push vào main & Scan thành công)
      # --------------------------------------------------------
      - name: Push Docker Image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ============================================================
  # 3. DEPLOY TO TARGET SERVER (Ví dụ VPS)
  # ============================================================
  deploy:
    name: Deploy to VMware Local Target
    runs-on: self-hosted  # <--- ĐÂY LÀ ĐIỂM KEY: Chuyển Job về máy ảo VMware!
    needs: build-scan-and-push

    steps:
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Docker Image mới nhất
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.GHCR_IMAGE }}:v2

      - name: Khởi chạy/Cập nhật Container
        run: |
          docker stop todo-api || true
          docker rm todo-api || true
          docker run -d \
            --name todo-api \
            --restart always \
            -p 3000:3000 \
            ${{ env.REGISTRY }}/${{ env.GHCR_IMAGE }}:v2

      - name: Dọn dẹp Image cũ
        run: |
          docker image prune -f