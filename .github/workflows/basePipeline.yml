name: Base CI/CD Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    Code-Lint-and-Test:
        name: code lint and unit test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Thiết lập môi trường Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'

            - name: cài đặt các thư viện
              run: npm install
            
            - name: kiểm tra cú pháp
              run: npm run lint

            - name: Chạy Unit test
              run: npm test
    
    security-and-build:
      name: Build Docker Image & security Trivy
      runs-on: ubuntu-latest
      needs: Code-Lint-and-Test

      steps:
        - name: checkout mã nguồn
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker Image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            load: true
            no-cache: true
            tags: todo-nodejs-api:v2

        - name: Show Docker images
          run: docker images

        - name: Inspect image
          run: docker image inspect todo-nodejs-api:v2
        
        - name: Install Trivy
          run: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sudo sh -s -- -b /usr/local/bin v0.72.0

        - name: Check Trivy version
          run: trivy --version

        - name: Scan Docker image
          run: |
            trivy image \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              todo-nodejs-api:v2


    push-to-registry:
      name: Push Image to GHCR
      runs-on: ubuntu-latest
      needs: security-and-build # Chỉ chạy khi build và quét bảo mật thành công 100%

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GHCR_TOKEN }} # Lấy token bảo mật từ Secrets đã cấu hình

        - name: Extract metadata (tags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}
            tags: |
              type=raw,value=latest
              type=sha,format=long

        
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              ghcr.io/${{ github.repository }}:v2  # <-- Thay vì 'latest', bạn dùng 'v2'
              ghcr.io/${{ github.repository }}:latest # <-- Có thể giữ lại hoặc bỏ tùy bạn
            labels: ${{ steps.meta.outputs.labels }}
