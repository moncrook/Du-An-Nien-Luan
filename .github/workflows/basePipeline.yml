name: Base CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: todo-nodejs-api
  IMAGE_TAG: v2
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/moncrook/du-an-nien-luan

jobs:

  # ============================================================
  # 1. LINT + UNIT TEST
  # ============================================================
  Code-Lint-and-Test:
    name: Code Lint and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cài đặt dependencies
        run: npm ci

      - name: Kiểm tra npm audit
        run: npm audit --audit-level=high

      - name: Kiểm tra cú pháp
        run: npm run lint

      - name: Chạy Unit Test
        run: npm test


  # ============================================================
  # 2. BUILD DOCKER + SECURITY SCAN
  # ============================================================
  security-and-build:
    name: Build Docker Image and Security Scan
    runs-on: ubuntu-latest
    needs: Code-Lint-and-Test

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          no-cache: true
          tags: todo-nodejs-api:v2

      # --------------------------------------------------------
      # Kiểm tra image có tồn tại
      # --------------------------------------------------------
      - name: Show Docker Images
        run: docker images

      - name: Inspect Docker Image
        run: docker image inspect todo-nodejs-api:v2

      # --------------------------------------------------------
      # Kiểm tra dependencies thực tế trong production image
      # --------------------------------------------------------
      - name: Verify production dependencies
        run: |
          docker run --rm todo-nodejs-api:v2 npm ls tar
          docker run --rm todo-nodejs-api:v2 npm ls brace-expansion

      # --------------------------------------------------------
      # Kiểm tra Node và npm trong image
      # --------------------------------------------------------
      - name: Check Node and npm version
        run: |
          docker run --rm todo-nodejs-api:v2 node --version
          docker run --rm todo-nodejs-api:v2 npm --version

      # --------------------------------------------------------
      # Trivy scan
      #
      # Dùng Trivy container chính thức thay vì install.sh
      # --------------------------------------------------------
      - name: Download Trivy vulnerability database
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            image --download-db-only

      - name: Scan Docker Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:0.72.0 \
            image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            todo-nodejs-api:v2


  # ============================================================
  # 3. PUSH IMAGE TO GHCR
  # ============================================================
  push-to-registry:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: security-and-build

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Login vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=v2
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}